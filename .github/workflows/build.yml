name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: onionyst/reader
  DOCKERFILE_PATH: build/package/Docker/Dockerfile

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Send notification to Slack
        if: ${{ always() }}
        uses: onionyst/action-slack-notify@v1
        env:
          SLACK_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          SLACK_AVATAR_URL: ${{ github.event.repository.owner.avatar_url || '' }}
          SLACK_COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
          SLACK_COMMIT_MSG: ${{ github.event.head_commit.message || github.ref_name }}
          SLACK_COMMIT_URL: ${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
          SLACK_COMPARE_URL: ${{ github.event.compare || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          SLACK_EMAIL: ${{ github.event.head_commit.author.email || '' }}
          SLACK_STATUS: ${{ job.status }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
